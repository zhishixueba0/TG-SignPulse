# TG-SignPulse v2.7.0（GitHub 源码自建），与旧版 1.0.130 并行。
# 旧版：/opt/tg-signpulse，容器 tg-signpulse，127.0.0.1:18765，不动。
# 本版：/opt/fork-tg-signpulse，容器 fork-tg-signpulse，127.0.0.1:18766，数据卷独立。
# telegram-manager：/opt/telegram-manager，127.0.0.1:8000，不动。
services:
  app:
    image: ghcr.io/zhishixueba0/tg-signpulse:latest
    container_name: fork-tg-signpulse
    ports:
      - "127.0.0.1:18766:8080"
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - ./data:/data
    environment:
      - PORT=8080
      - APP_DATA_DIR=/data
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - APP_LEGACY_TASKS_READONLY=1
      - APP_SCHEDULER_LOCK=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/__pycache__
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
